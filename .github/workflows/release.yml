name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.1)"
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Linux engine runtime
        run: bash scripts/linux/prepare-engine-runtime.sh
      - name: Prepare CAPA (Linux)
        run: bash scripts/linux/prepare-capa.sh
      - name: Prepare FLOSS (Linux)
        run: bash scripts/linux/prepare-floss.sh
      - name: Prepare bulk_extractor (Linux)
        run: bash scripts/linux/prepare-bulk-extractor.sh

      - name: Sanity-check the bundled tool binaries actually run
        run: |
          set -e
          "app/desktop/resources/runtime/python" --version
          "app/desktop/resources/tools/capa/capa" --version
          "app/desktop/resources/tools/floss/floss" --version
          "app/desktop/resources/tools/bulk_extractor/bulk_extractor" -h | head -1

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Install desktop (Tauri CLI) dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Run engine test suite
        run: |
          python3 -m venv engine/.venv
          source engine/.venv/bin/activate
          pip install -e "engine[dev]"
          python -m pytest tests/engine -q

      - name: Build Linux bundles (deb + appimage)
        working-directory: app/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles deb,appimage --verbose

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            app/desktop/target/release/bundle/deb/*.deb
            app/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/windows/build-release.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "MemHunter $TAG" \
            --generate-notes \
            dist/linux/deb/*.deb \
            dist/linux/appimage/*.AppImage \
            dist/windows/*.exe
